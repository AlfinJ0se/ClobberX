<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/html.min.js"></script>
    <link rel="stylesheet" href="/static/style.css" />
    <title>ClobberX</title>
  </head>
  <body>
    <main class="clobber">
      <div class="container">
        <header class="logo">
          <h1>
              <span class="text-wrapper">Clobber</span>
              <span class="text-wrapper-2">X</span>
          </h1>
        </header>
        
        <form class="form-container">
          <div class="input-group">
            <input 
              type="text" 
              id="clobbering-target"
              class="input-field" 
              placeholder="Target    Examples: window.MODE_DEBUG  ,  document.cookie "
              aria-label="Target input"
            />
            <div class="icon-container">
                <img class="input-icon" src="https://c.animaapp.com/vpz8jCvz/img/target.svg" alt="Target icon" />
            </div>
          </div>

          <div class="input-group">
            <input 
              type="text" 
              id="clobbering-value"
              class="input-field" 
              placeholder="Value ..."
              aria-label="Value input"
            />
            <div class="icon-container">
                <img class="input-icon" src="https://c.animaapp.com/vpz8jCvz/img/frame.svg" alt="Value icon" />
            </div>
          </div>

          <button id="submit" class="generate-btn">
              <span>Generate</span>
              <img class="btn-icon" src="https://c.animaapp.com/vpz8jCvz/img/-x32-.svg" alt="Generate icon" />
            <span>Payload</span>
          </button>
        </form>

        <div class="result-box" id="clobbering-result"></div>
      </div>
    </main>
  </body>
  <script src="static/payload_generator.js"></script>
</html>
